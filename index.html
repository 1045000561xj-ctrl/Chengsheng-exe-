let ctx = null;
let buffer = null;
let source = null;
let taps = 0;
let last = 0;
let running = false;
let unlocked = false;
let startedAt = 0;
let timer = null;

const screen = document.getElementById('s');
const warning = document.getElementById('w');
const statusEl = document.getElementById('status');
const hint = document.getElementById('h');
const word = document.getElementById('word');
const count = document.getElementById('count');

function b64ToArrayBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

async function unlockAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (ctx.state === 'suspended') await ctx.resume();

  if (!buffer) {
    const arr = b64ToArrayBuffer(AUDIO_B64);
    buffer = await ctx.decodeAudioData(arr.slice(0));
  }

  // 播一个几乎听不到的极短音，确保 iOS 将音频上下文真正解锁
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  gain.gain.value = 0.00001;
  osc.connect(gain).connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + 0.02);

  unlocked = true;
  statusEl.textContent = 'SYSTEM NORMAL / SOUND ARMED';
}

function stopCurrent() {
  if (source) {
    try { source.stop(); } catch(e) {}
    source = null;
  }
  if (timer) clearInterval(timer);
}

async function trigger() {
  running = true;
  warning.classList.add('on');

  if (!unlocked) await unlockAudio();
  if (ctx.state === 'suspended') await ctx.resume();

  stopCurrent();

  source = ctx.createBufferSource();
  source.buffer = buffer;

  const master = ctx.createGain();
  master.gain.value = 1.0;

  // 轻微高频增强，让网页端保持刺耳感
  const high = ctx.createBiquadFilter();
  high.type = 'peaking';
  high.frequency.value = 3200;
  high.Q.value = 1.1;
  high.gain.value = 4.5;

  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18;
  comp.knee.value = 8;
  comp.ratio.value = 5;
  comp.attack.value = 0.003;
  comp.release.value = 0.12;

  source.connect(high).connect(comp).connect(master).connect(ctx.destination);
  source.start(0);
  startedAt = ctx.currentTime;

  if (navigator.vibrate) navigator.vibrate([80,45,80]);

  timer = setInterval(() => {
    const elapsed = ctx.currentTime - startedAt;
    const progress = Math.min(1, elapsed / buffer.duration);
    const n = Math.max(1, Math.min(30, Math.floor(progress * 30) + 1));
    count.textContent = String(n).padStart(2,'0') + ' / 30';
    word.style.transform = `scale(${1+Math.min(n,20)*.016}) rotate(${(Math.random()-.5)*4}deg)`;
    if (n >= 5) warning.classList.add('glitch');
    if (n >= 13) document.body.classList.add('flash');
  }, 40);

  source.onended = () => {
    clearInterval(timer);
    document.body.classList.remove('flash');
    warning.classList.remove('glitch');
    setTimeout(() => {
      warning.classList.remove('on');
      running = false;
      count.textContent = '01 / 30';
      word.style.transform = '';
      hint.textContent = 'tap somewhere. nothing will happen.';
    }, 650);
  };
}

screen.addEventListener('pointerup', async () => {
  if (running) return;

  try {
    if (!unlocked) {
      await unlockAudio();
      hint.textContent = 'sound armed.';
    }
  } catch(e) {
    statusEl.textContent = 'AUDIO ERROR';
    hint.textContent = 'open this page in Safari';
    return;
  }

  const now = Date.now();
  if (now - last > 10000) taps = 0;
  last = now;
  taps++;

  if (taps >= 7) {
    taps = 0;
    await trigger();
  }
}, {passive:false});
</script>
